services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustdesk
      POSTGRES_USER: trustdesk
      POSTGRES_PASSWORD: trustdesk
    volumes:
      - trustdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustdesk -d trustdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://trustdesk:trustdesk@postgres:5432/trustdesk
      DEMO_TOKEN: trustdesk-demo
      LLM_PROVIDER: mock
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
volumes:
  trustdesk_pg:
